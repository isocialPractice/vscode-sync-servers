name: Dependency review

on:
  pull_request:

permissions: {}

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails on moderate or worse vulnerabilities, and on any dependency whose
      # licence is not on this permissive list, so no copyleft licence enters.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0,
            BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Python-2.0, Unlicense
