version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The API types follow engines.vscode, the oldest supported release.
      - dependency-name: '@types/vscode'
      # typescript-eslint supports TypeScript up to 6.0. Move to 7.x once it
      # declares support for it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node follows the Node.js line of the oldest supported VS Code.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
